[project]
name = "reportlens-ocr-engine"
version = "0.1.0"
description = "Custom OCR pipeline: classical line segmentation + fine-tuned TrOCR recognition."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pillow>=10.0"]

[project.optional-dependencies]
# Default production recogniser. Needs the system `tesseract` binary too (pre-installed on
# Colab; `apt-get install tesseract-ocr` on Debian/Ubuntu hosts). Includes PyMuPDF for
# PDF -> page-image conversion, since most real report uploads are PDFs, not raw images.
ocr = ["pytesseract>=0.3.10", "pymupdf>=1.24"]
# Heavy training/inference stack for the optional fine-tuned TrOCR path. Kept separate so
# the package stays light for CI and the API container.
train = [
    "torch>=2.2",
    # <5 on purpose: v5 reworked tokenizer loading and breaks TrOCR processor loading.
    "transformers>=4.44,<5",
    "datasets>=2.20",
    "jiwer>=3.0",          # CER / WER metrics
    "accelerate>=0.33",
    # both are needed to build TrOCR's fast tokenizer from the slow one
    "sentencepiece>=0.2",
    "protobuf",
]
dev = ["pytest>=8", "ruff>=0.6"]

# Explicit package discovery: setuptools' flat-layout auto-discovery ignores tests/ but
# treats notebooks/ as a second top-level package and refuses to build. Pin it here.
[tool.setuptools.packages.find]
include = ["ocr_engine*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]  # Colab notebooks aren't linted as production code

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
