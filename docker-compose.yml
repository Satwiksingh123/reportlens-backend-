services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # Deliberately NOT published to the host. Only api/worker talk to it, and they reach it
    # as http://ollama:11434 over the compose network. Publishing it also collided with a
    # locally-installed Ollama already holding port 11434.
    expose:
      - "11434"
    volumes:
      - ollama_models:/root/.ollama

  api:
    build:
      # repo root, so the Dockerfile can also copy the sibling service packages
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/app
      # keep the sibling packages live-editable too; without these the container would use
      # the copies baked into the image and ignore local edits
      - ./services/medical_parser/medical_parser:/opt/packages/medical_parser:ro
      - ./services/ocr_engine/ocr_engine:/opt/packages/ocr_engine:ro
      - ./services/rag/rag:/opt/packages/rag:ro
      - ./services/llm_service/llm_service:/opt/packages/llm_service:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      # repo root, so the Dockerfile can also copy the sibling service packages
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/api:/app
      # keep the sibling packages live-editable too; without these the container would use
      # the copies baked into the image and ignore local edits
      - ./services/medical_parser/medical_parser:/opt/packages/medical_parser:ro
      - ./services/ocr_engine/ocr_engine:/opt/packages/ocr_engine:ro
      - ./services/rag/rag:/opt/packages/rag:ro
      - ./services/llm_service/llm_service:/opt/packages/llm_service:ro
    command: celery -A app.tasks.celery_app worker --loglevel=info

volumes:
  pgdata:
  ollama_models:
